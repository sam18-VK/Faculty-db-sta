{% extends "base.html" %}
{% block title %}{% if department %}Edit Department{% else %}Add Department{% endif %}{% endblock %}
{% block content %}
<h2 class="page-title mb-4">{% if department %}Edit Department{% else %}Add New Department{% endif %}</h2>

<form method="post" action="{{ form_action }}" class="card shadow-sm p-4">
  <div class="row g-3">
    <div class="col-md-8">
      <label class="form-label">Department Name *</label>
      <input type="text" class="form-control" name="name" required
             value="{{ department.name if department else '' }}" placeholder="e.g. Science">
    </div>
    <div class="col-md-4">
      <label class="form-label">Code *</label>
      <input type="text" class="form-control" name="code" required maxlength="10"
             value="{{ department.code if department else '' }}" placeholder="e.g. SCI">
    </div>
    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="2">{{ department.description if department else '' }}</textarea>
    </div>
  </div>

  <div class="mt-4">
    <button type="submit" class="btn btn-primary">{% if department %}Save Changes{% else %}Add Department{% endif %}</button>
    <a href="{{ url_for('department_list') }}" class="btn btn-link">Cancel</a>
  </div>
</form>
{% endblock %}
