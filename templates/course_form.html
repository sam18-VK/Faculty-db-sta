{% extends "base.html" %}
{% block title %}{% if course %}Edit Course{% else %}Add Course{% endif %}{% endblock %}
{% block content %}
<h2 class="page-title mb-4">{% if course %}Edit Course{% else %}Add New Course{% endif %}</h2>

<form method="post" action="{{ form_action }}" class="card shadow-sm p-4">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Course Name *</label>
      <input type="text" class="form-control" name="name" required
             value="{{ course.name if course else '' }}" placeholder="e.g. Database Systems">
    </div>
    <div class="col-md-3">
      <label class="form-label">Course Code *</label>
      <input type="text" class="form-control" name="code" required maxlength="20"
             value="{{ course.code if course else '' }}" placeholder="e.g. TECH301">
    </div>
    <div class="col-md-3">
      <label class="form-label">Department *</label>
      <select class="form-select" name="department_id" required>
        <option value="">Select department</option>
        {% for d in departments %}
        <option value="{{ d.department_id }}" {% if course and course.department_id == d.department_id %}selected{% endif %}>{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="mt-4">
    <button type="submit" class="btn btn-primary">{% if course %}Save Changes{% else %}Add Course{% endif %}</button>
    <a href="{{ url_for('course_list') }}" class="btn btn-link">Cancel</a>
  </div>
</form>
{% endblock %}
